name: Build RSDKv1 iOS (Retro-Sonic)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-rsdkv1.yml'
  workflow_dispatch:

env:
  IOS_MIN_VERSION: "13.0"
  ARCH: arm64

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Clone RSDKv2 (base for RSDKv1 adaptation)
        run: |
          git clone --recursive https://github.com/RSDKModding/RSDKv2-Decompilation.git
          cd RSDKv2-Decompilation
          git log --oneline -5

      - name: Setup iOS toolchain
        run: |
          echo "SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV
          echo "CC=$(xcrun -find clang)" >> $GITHUB_ENV
          echo "CXX=$(xcrun -find clang++)" >> $GITHUB_ENV

      - name: Apply iOS platform support
        working-directory: RSDKv2-Decompilation
        run: |
          python3 << 'PYEOF'
          import re

          # RetroEngine.hpp - add RETRO_iOS platform
          path = "RSDKv2/RetroEngine.hpp"
          with open(path) as f:
              content = f.read()
          ios_block = """
  #if TARGET_OS_IPHONE
  #define RETRO_PLATFORM   RETRO_iOS
  #define RETRO_DEVICETYPE RETRO_MOBILE
  #define RETRO_iOS        (6)
  #endif
  """
          if "RETRO_iOS" not in content:
              content = content.replace(
                  "#ifndef RETRO_PLATFORM",
                  ios_block + "\n#ifndef RETRO_PLATFORM"
              )
              with open(path, "w") as f:
                  f.write(content)
              print(f"Patched {path}: added RETRO_iOS platform")

          # Userdata.cpp - add iOS Documents path
          path = "RSDKv2/Userdata.cpp"
          with open(path) as f:
              content = f.read()
          if "RETRO_iOS" not in content:
              ios_userdata = """#if RETRO_PLATFORM == RETRO_iOS
  #import <Foundation/Foundation.h>
  static const char *getDocumentsPath() {
      static NSString *_docsBuf = nil;
      if (!_docsBuf) {
          NSArray *paths = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES);
          _docsBuf = [[paths firstObject] stringByAppendingString:@"/"];
      }
      return [_docsBuf UTF8String];
  }
  #endif

  void InitUserdata() {
  #if RETRO_PLATFORM == RETRO_iOS
      StrCopy(gamePath, getDocumentsPath());
  #elif RETRO_PLATFORM == RETRO_ANDROID"""
              content = content.replace(
                  "void InitUserdata() {\n",
                  ios_userdata + "\n"
              )
              with open(path, "w") as f:
                  f.write(content)
              print(f"Patched {path}: added iOS Documents path")

          # RetroEngine.cpp - add iOS dataFile path
          path = "RSDKv2/RetroEngine.cpp"
          with open(path) as f:
              content = f.read()
          if "RETRO_iOS" not in content:
              content = content.replace(
                  "#elif RETRO_PLATFORM == RETRO_ANDROID",
                  "#elif RETRO_PLATFORM == RETRO_iOS\n    StrCopy(dest, gamePath);\n    StrAdd(dest, Engine.dataFile);\n#elif RETRO_PLATFORM == RETRO_ANDROID"
              )
              with open(path, "w") as f:
                  f.write(content)
              print(f"Patched {path}: added iOS dataFile path")

          # Ini.cpp - add iOS alongside macOS
          path = "RSDKv2/Ini.cpp"
          with open(path) as f:
              content = f.read()
          if "RETRO_iOS" not in content:
              content = content.replace(
                  "#elif RETRO_PLATFORM == RETRO_OSX",
                  "#elif RETRO_PLATFORM == RETRO_OSX || RETRO_PLATFORM == RETRO_iOS"
              )
              with open(path, "w") as f:
                  f.write(content)
              print(f"Patched {path}: added iOS to OSX path")

          # Debug.cpp - add iOS log path
          path = "RSDKv2/Debug.cpp"
          with open(path) as f:
              content = f.read()
          if "RETRO_iOS" not in content:
              content = content.replace(
                  "#elif RETRO_PLATFORM == RETRO_ANDROID",
                  "#elif RETRO_PLATFORM == RETRO_iOS\n    sprintf(pathBuffer, \"%s/log.txt\", gamePath);\n#elif RETRO_PLATFORM == RETRO_ANDROID"
              )
              with open(path, "w") as f:
                  f.write(content)
              print(f"Patched {path}: added iOS log path")

          # Reader.cpp - add iOS to file path resolution
          path = "RSDKv2/Reader.cpp"
          with open(path) as f:
              content = f.read()
          if "RETRO_iOS" not in content:
              content = content.replace(
                  "RETRO_PLATFORM == RETRO_OSX || RETRO_PLATFORM == RETRO_ANDROID",
                  "RETRO_PLATFORM == RETRO_OSX || RETRO_PLATFORM == RETRO_ANDROID || RETRO_PLATFORM == RETRO_iOS"
              )
              with open(path, "w") as f:
                  f.write(content)
              print(f"Patched {path}: added iOS to reader path")

          print("iOS platform patches applied successfully")
          PYEOF

      - name: Apply RSDKv1 data format changes
        working-directory: RSDKv2-Decompilation
        run: |
          python3 << 'PYEOF'
          # Scene.cpp - RSDKv1 format changes
          path = "RSDKv2/Scene.cpp"
          with open(path) as f:
              content = f.read()

          # 1. Add cameraLag variable near other globals
          if "cameraLag" not in content:
              content = content.replace(
                  "int stageListPosition;",
                  "int stageListPosition;\n\nint cameraLag = 0;"
              )
              print("Added cameraLag variable")

          # 2. Add GFX fallback for tile loading
          # RSDKv1 tries GIF first, falls back to GFX
          if "LoadStageGFXFile" not in content:
              gfx_func = """
  // RSDKv1: Load GFX tile file (RLE-compressed paletted images)
  void LoadStageGFXFile(int listNo) {
      int info = 0;
      if (!OpenStageFile("16x16Tiles.gfx", listNo, &info))
          return;

      byte gfxWidth = 0;
      byte gfxHeight = 0;
      FileRead(&gfxWidth, 1);
      FileRead(&gfxHeight, 1);

      // Skip palette (255 RGB triplets = 765 bytes)
      byte paletteSkip[765];
      FileRead(paletteSkip, 765);

      // RLE decode pixel data
      int x = 0, y = 0;
      byte pixel = 0;
      byte count = 0;
      while (y < gfxHeight) {
          FileRead(&pixel, 1);
          if (pixel == 0xFF) {
              FileRead(&pixel, 1);
              FileRead(&count, 1);
              for (int i = 0; i <= count; i++) {
                  // Store pixel at tile position
                  x++;
                  if (x >= gfxWidth) { x = 0; y++; }
              }
          } else {
              x++;
              if (x >= gfxWidth) { x = 0; y++; }
          }
      }
      CloseFile();
  }
  """
              content = content.replace(
                  "int LoadStageFiles()",
                  gfx_func + "\nint LoadStageFiles()"
              )
              print("Added LoadStageGFXFile function")

          # 3. Add RSDKv1 chunk loading with 3-byte entries
          if "LoadStageChunks_RSDKv1" not in content:
              chunk_func = """
  // RSDKv1: Load chunks with 3-byte entries (10-bit tile index)
  void LoadStageChunks_RSDKv1() {
      byte entry[3];
      for (int i = 0; i < 0x4000; ++i) {
          if (FileRead(&entry, 3) == 0) break;
          entry[0] -= (byte)((entry[0] >> 6) << 6);
          tiles128x128.tileIndex[i] = entry[1] + (entry[0] << 8);
          tiles128x128.gfxDataPos[i] = tiles128x128.tileIndex[i] << 8;
          tiles128x128.direction[i]  = entry[2] >> 4;
          tiles128x128.visualPlane[i] = (entry[2] >> 2) & 3;
          tiles128x128.collisionFlag1[i] = entry[2] & 1;
          tiles128x128.collisionFlag2[i] = (entry[2] >> 1) & 1;
      }
  }
  """
              content = content.replace(
                  "int LoadStageFiles()",
                  chunk_func + "\nint LoadStageFiles()"
              )
              print("Added LoadStageChunks_RSDKv1 function")

          with open(path, "w") as f:
              f.write(content)
          print("RSDKv1 format changes applied to Scene.cpp")

          # Script.cpp - add functionStack
          path = "RSDKv2/Script.cpp"
          with open(path) as f:
              content = f.read()
          if "functionStack" not in content:
              content = content.replace(
                  "int scriptData[0x40000];",
                  "int scriptData[0x40000];\n\n// RSDKv1: function call stack\nint functionStack[0x100];\nint functionStackPos = 0;"
              )
              with open(path, "w") as f:
                  f.write(content)
              print("Added functionStack to Script.cpp")

          print("RSDKv1 data format changes applied successfully")
          PYEOF

      - name: Build SDL2 for iOS
        run: |
          git clone --depth 1 --branch release-2.30.0 https://github.com/libsdl-org/SDL.git /tmp/SDL2
          cd /tmp/SDL2
          mkdir build-ios && cd build-ios
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.IOS_MIN_VERSION }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ env.ARCH }} \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/RSDKv2-Decompilation/ios-deps \
            -DSDL_STATIC=ON \
            -DSDL_SHARED=OFF \
            -DSDL_TEST=OFF \
            -DSDL_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(sysctl -n hw.ncpu)
          cmake --install .

      - name: Build libogg + libvorbis for iOS
        run: |
          DEPS_DIR=${{ github.workspace }}/RSDKv2-Decompilation/ios-deps

          # libogg
          git clone --depth 1 https://github.com/xiph/ogg.git /tmp/ogg
          cd /tmp/ogg && mkdir build && cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.IOS_MIN_VERSION }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ env.ARCH }} \
            -DCMAKE_INSTALL_PREFIX=$DEPS_DIR \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(sysctl -n hw.ncpu) && cmake --install .

          # libvorbis
          git clone --depth 1 https://github.com/xiph/vorbis.git /tmp/vorbis
          cd /tmp/vorbis && mkdir build && cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.IOS_MIN_VERSION }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ env.ARCH }} \
            -DCMAKE_INSTALL_PREFIX=$DEPS_DIR \
            -DCMAKE_PREFIX_PATH=$DEPS_DIR \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(sysctl -n hw.ncpu) && cmake --install .

      - name: Configure RSDKv1 (CMake for iOS)
        working-directory: RSDKv2-Decompilation
        run: |
          cmake -B build \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.IOS_MIN_VERSION }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ env.ARCH }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_FIND_ROOT_PATH="${{ github.workspace }}/RSDKv2-Decompilation/ios-deps" \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/RSDKv2-Decompilation/ios-deps" \
            -DRETRO_MOD_LOADER=OFF \
            -DFORCE_CASE_INSENSITIVE=ON

      - name: Build RSDKv1
        run: cmake --build RSDKv2-Decompilation/build -j$(sysctl -n hw.ncpu)

      - name: Package IPA
        run: |
          mkdir -p Payload/RSDKv1.app

          BINARY=$(find RSDKv2-Decompilation/build -name "RSDKv2" -type f ! -name "*.a" ! -name "*.dylib" | head -1)
          if [ -z "$BINARY" ]; then
            echo "ERROR: RSDKv1 binary not found"
            find RSDKv2-Decompilation/build -type f -executable
            exit 1
          fi

          cp "$BINARY" Payload/RSDKv1.app/RSDKv1

          cat > Payload/RSDKv1.app/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>RSDKv1</string>
            <key>CFBundleIdentifier</key>
            <string>com.rsdkmodding.rsdkv1</string>
            <key>CFBundleName</key>
            <string>Retro-Sonic</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>MinimumOSVersion</key>
            <string>13.0</string>
          </dict>
          </plist>
          PLIST

          zip -r RSDKv1.ipa Payload
          echo "IPA size: $(du -h RSDKv1.ipa | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: RSDKv1-iOS-arm64
          path: RSDKv1.ipa
          retention-days: 30
