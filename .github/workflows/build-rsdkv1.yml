name: Build RSDKv1 iOS (Retro-Sonic)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-rsdkv1.yml'
  workflow_dispatch:

env:
  IOS_MIN_VERSION: "13.0"
  ARCH: arm64

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Clone RSDKv2 (base for RSDKv1 adaptation)
        run: |
          git clone --recursive https://github.com/RSDKModding/RSDKv2-Decompilation.git
          cd RSDKv2-Decompilation
          git log --oneline -5

      - name: Setup iOS toolchain
        run: |
          echo "SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV
          echo "CC=$(xcrun -find clang)" >> $GITHUB_ENV
          echo "CXX=$(xcrun -find clang++)" >> $GITHUB_ENV

      - name: Apply iOS platform support
        working-directory: RSDKv2-Decompilation
        run: |
          cat > /tmp/patch_ios.py << 'PYEOF'
          import re, os

          def patch_file(path, old, new):
              with open(path) as f: content = f.read()
              if new.split('\n')[0] in content:
                  print(f'  SKIP {path} (already patched)')
                  return
              if old not in content:
                  print(f'  WARN {path}: pattern not found, skipping')
                  return
              content = content.replace(old, new)
              with open(path, 'w') as f: f.write(content)
              print(f'  OK   {path}')

          print('Applying iOS platform patches to RSDKv2...')

          # RetroEngine.hpp
          patch_file('RSDKv2/RetroEngine.hpp',
              '#ifndef RETRO_PLATFORM',
              '#if TARGET_OS_IPHONE\n#define RETRO_PLATFORM   RETRO_iOS\n#define RETRO_DEVICETYPE RETRO_MOBILE\n#define RETRO_iOS        (6)\n#endif\n\n#ifndef RETRO_PLATFORM')

          # Userdata.cpp
          patch_file('RSDKv2/Userdata.cpp',
              'void InitUserdata() {',
              '#if RETRO_PLATFORM == RETRO_iOS\n#import <Foundation/Foundation.h>\nstatic const char *getDocumentsPath() {\n    static NSString *_docsBuf = nil;\n    if (!_docsBuf) {\n        NSArray *paths = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES);\n        _docsBuf = [[paths firstObject] stringByAppendingString:@"/"];\n    }\n    return [_docsBuf UTF8String];\n}\n#endif\n\nvoid InitUserdata() {\n#if RETRO_PLATFORM == RETRO_iOS\n    StrCopy(gamePath, getDocumentsPath());\n#else')

          # RetroEngine.cpp
          patch_file('RSDKv2/RetroEngine.cpp',
              '#elif RETRO_PLATFORM == RETRO_ANDROID',
              '#elif RETRO_PLATFORM == RETRO_iOS\n    StrCopy(dest, gamePath);\n    StrAdd(dest, Engine.dataFile);\n#elif RETRO_PLATFORM == RETRO_ANDROID')

          # Ini.cpp
          patch_file('RSDKv2/Ini.cpp',
              '#elif RETRO_PLATFORM == RETRO_OSX',
              '#elif RETRO_PLATFORM == RETRO_OSX || RETRO_PLATFORM == RETRO_iOS')

          # Debug.cpp
          patch_file('RSDKv2/Debug.cpp',
              '#elif RETRO_PLATFORM == RETRO_ANDROID',
              '#elif RETRO_PLATFORM == RETRO_iOS\n    sprintf(pathBuffer, \"%s/log.txt\", gamePath);\n#elif RETRO_PLATFORM == RETRO_ANDROID')

          # Reader.cpp
          patch_file('RSDKv2/Reader.cpp',
              'RETRO_PLATFORM == RETRO_OSX || RETRO_PLATFORM == RETRO_ANDROID',
              'RETRO_PLATFORM == RETRO_OSX || RETRO_PLATFORM == RETRO_ANDROID || RETRO_PLATFORM == RETRO_iOS')

          print('iOS patches applied successfully')
          PYEOF
          python3 /tmp/patch_ios.py

      - name: Apply RSDKv1 data format changes
        working-directory: RSDKv2-Decompilation
        run: |
          cat > /tmp/patch_rsdkv1.py << 'PYEOF'
          # Scene.cpp - RSDKv1 format changes
          path = 'RSDKv2/Scene.cpp'
          with open(path) as f: content = f.read()

          # 1. Add cameraLag variable
          if 'cameraLag' not in content:
              content = content.replace('int stageListPosition;', 'int stageListPosition;\n\nint cameraLag = 0;')
              print('Added cameraLag variable')

          # 2. Add GFX fallback function
          if 'LoadStageGFXFile' not in content:
              gfx = '\nvoid LoadStageGFXFile(int listNo) {\n    int info = 0;\n    if (!OpenStageFile("16x16Tiles.gfx", listNo, &info))\n        return;\n    byte gfxWidth = 0;\n    byte gfxHeight = 0;\n    FileRead(&gfxWidth, 1);\n    FileRead(&gfxHeight, 1);\n    byte paletteSkip[765];\n    FileRead(paletteSkip, 765);\n    int x = 0, y = 0;\n    byte pixel = 0;\n    byte count = 0;\n    while (y < gfxHeight) {\n        FileRead(&pixel, 1);\n        if (pixel == 0xFF) {\n            FileRead(&pixel, 1);\n            FileRead(&count, 1);\n            for (int i = 0; i <= count; i++) {\n                x++;\n                if (x >= gfxWidth) { x = 0; y++; }\n            }\n        } else {\n            x++;\n            if (x >= gfxWidth) { x = 0; y++; }\n        }\n    }\n    CloseFile();\n}\n'
              content = content.replace('int LoadStageFiles()', gfx + '\nint LoadStageFiles()')
              print('Added LoadStageGFXFile function')

          # 3. Add RSDKv1 chunk loading
          if 'LoadStageChunks_RSDKv1' not in content:
              chunk = '\nvoid LoadStageChunks_RSDKv1() {\n    byte entry[3];\n    for (int i = 0; i < 0x4000; ++i) {\n        if (FileRead(&entry, 3) == 0) break;\n        entry[0] -= (byte)((entry[0] >> 6) << 6);\n        tiles128x128.tileIndex[i] = entry[1] + (entry[0] << 8);\n        tiles128x128.gfxDataPos[i] = tiles128x128.tileIndex[i] << 8;\n        tiles128x128.direction[i]  = entry[2] >> 4;\n        tiles128x128.visualPlane[i] = (entry[2] >> 2) & 3;\n        tiles128x128.collisionFlag1[i] = entry[2] & 1;\n        tiles128x128.collisionFlag2[i] = (entry[2] >> 1) & 1;\n    }\n}\n'
              content = content.replace('int LoadStageFiles()', chunk + '\nint LoadStageFiles()')
              print('Added LoadStageChunks_RSDKv1 function')

          with open(path, 'w') as f: f.write(content)
          print('RSDKv1 format changes applied to Scene.cpp')

          # Script.cpp - add functionStack
          path = 'RSDKv2/Script.cpp'
          with open(path) as f: content = f.read()
          if 'functionStack' not in content:
              content = content.replace(
                  'int scriptData[0x40000];',
                  'int scriptData[0x40000];\n\nint functionStack[0x100];\nint functionStackPos = 0;'
              )
              with open(path, 'w') as f: f.write(content)
              print('Added functionStack to Script.cpp')

          print('RSDKv1 data format changes applied successfully')
          PYEOF
          python3 /tmp/patch_rsdkv1.py

      - name: Build SDL2 for iOS
        run: |
          git clone --depth 1 --branch release-2.30.0 https://github.com/libsdl-org/SDL.git /tmp/SDL2
          cd /tmp/SDL2
          mkdir build-ios && cd build-ios
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.IOS_MIN_VERSION }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ env.ARCH }} \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/RSDKv2-Decompilation/ios-deps \
            -DSDL_STATIC=ON \
            -DSDL_SHARED=OFF \
            -DSDL_TEST=OFF \
            -DSDL_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(sysctl -n hw.ncpu)
          cmake --install .

      - name: Build libogg + libvorbis for iOS
        run: |
          DEPS_DIR=${{ github.workspace }}/RSDKv2-Decompilation/ios-deps
          git clone --depth 1 https://github.com/xiph/ogg.git /tmp/ogg
          cd /tmp/ogg && mkdir build && cd build
          cmake .. -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.IOS_MIN_VERSION }} -DCMAKE_OSX_ARCHITECTURES=${{ env.ARCH }} -DCMAKE_INSTALL_PREFIX=$DEPS_DIR -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(sysctl -n hw.ncpu) && cmake --install .
          git clone --depth 1 https://github.com/xiph/vorbis.git /tmp/vorbis
          cd /tmp/vorbis && mkdir build && cd build
          cmake .. -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.IOS_MIN_VERSION }} -DCMAKE_OSX_ARCHITECTURES=${{ env.ARCH }} -DCMAKE_INSTALL_PREFIX=$DEPS_DIR -DCMAKE_PREFIX_PATH=$DEPS_DIR -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(sysctl -n hw.ncpu) && cmake --install .

      - name: Configure and Build RSDKv1
        working-directory: RSDKv2-Decompilation
        run: |
          cmake -B build \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.IOS_MIN_VERSION }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ env.ARCH }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_FIND_ROOT_PATH="${{ github.workspace }}/RSDKv2-Decompilation/ios-deps" \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/RSDKv2-Decompilation/ios-deps" \
            -DRETRO_MOD_LOADER=OFF \
            -DFORCE_CASE_INSENSITIVE=ON
          cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Package IPA
        run: |
          mkdir -p Payload/RSDKv1.app
          BINARY=$(find RSDKv2-Decompilation/build -name "RSDKv2" -type f ! -name "*.a" ! -name "*.dylib" | head -1)
          if [ -z "$BINARY" ]; then
            echo "ERROR: RSDKv1 binary not found"
            find RSDKv2-Decompilation/build -type f -executable
            exit 1
          fi
          cp "$BINARY" Payload/RSDKv1.app/RSDKv1
          cat > Payload/RSDKv1.app/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>RSDKv1</string>
            <key>CFBundleIdentifier</key><string>com.rsdkmodding.rsdkv1</string>
            <key>CFBundleName</key><string>Retro-Sonic</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>MinimumOSVersion</key><string>13.0</string>
          </dict>
          </plist>
          PLIST
          zip -r RSDKv1.ipa Payload
          echo "IPA size: $(du -h RSDKv1.ipa | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: RSDKv1-iOS-arm64
          path: RSDKv1.ipa
          retention-days: 30
