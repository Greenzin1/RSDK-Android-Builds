name: Build RSDKLegacy (liveexec32 + Sega emulators)

on:
  push:
    branches: [main]
    paths:
      - 'liveexec32/**'
      - '.github/workflows/build-liveexec32.yml'
  workflow_dispatch:

env:
  THEOS: /opt/theos

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid dpkg

      - name: Install Theos
        run: |
          sudo mkdir -p $THEOS
          sudo chown $USER $THEOS
          git clone --recursive https://github.com/theos/theos.git $THEOS

      - name: Build LiveExec32
        working-directory: liveexec32
        run: |
          export THEOS=/opt/theos
          export PATH="$THEOS/bin:$PATH"
          make package FINALPACKAGE=1

      - name: Create IPA
        working-directory: liveexec32
        run: |
          # Copy dylib to Frameworks
          mkdir -p .theos/_/Payload/LiveExec32.app/Frameworks/
          cp lib/libdynarmic.dylib .theos/_/Payload/LiveExec32.app/Frameworks/
          # Create IPA
          cd .theos/_
          zip -r ../../RSDKLegacy.ipa Payload/
          cd ../..
          ls -la RSDKLegacy.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RSDKLegacy
          path: liveexec32/RSDKLegacy.ipa
          if-no-files-found: error
