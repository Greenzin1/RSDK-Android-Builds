name: Build RSDKv5 iOS (Sonic Mania)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-rsdkv5.yml'
  workflow_dispatch:

env:
  IOS_MIN_VERSION: "13.0"
  ARCH: arm64

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Clone RSDKv5 (iOS fork)
        run: |
          git clone --recursive https://github.com/WamWooWam/RSDKv5-Decompilation.git
          cd RSDKv5-Decompilation
          git log --oneline -5

      - name: Setup iOS toolchain
        run: |
          echo "SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV
          echo "CC=$(xcrun -find clang)" >> $GITHUB_ENV
          echo "CXX=$(xcrun -find clang++)" >> $GITHUB_ENV

      - name: Build SDL2 for iOS
        run: |
          git clone --depth 1 --branch release-2.30.0 https://github.com/libsdl-org/SDL.git /tmp/SDL2
          cd /tmp/SDL2
          mkdir build-ios && cd build-ios
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.IOS_MIN_VERSION }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ env.ARCH }} \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/RSDKv5-Decompilation/ios-deps \
            -DSDL_STATIC=ON \
            -DSDL_SHARED=OFF \
            -DSDL_TEST=OFF \
            -DSDL_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(sysctl -n hw.ncpu)
          cmake --install .

      - name: Build libogg + libvorbis + libtheora for iOS
        run: |
          DEPS_DIR=${{ github.workspace }}/RSDKv5-Decompilation/ios-deps
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          FLAGS="-arch ${{ env.ARCH }} -isysroot $SDK -miphoneos-version-min=${{ env.IOS_MIN_VERSION }}"

          # Build libogg (cmake)
          git clone --depth 1 https://github.com/xiph/ogg.git /tmp/ogg
          cd /tmp/ogg && mkdir build && cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.IOS_MIN_VERSION }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ env.ARCH }} \
            -DCMAKE_INSTALL_PREFIX=$DEPS_DIR \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(sysctl -n hw.ncpu) && cmake --install .

          # Build libvorbis (cmake)
          git clone --depth 1 https://github.com/xiph/vorbis.git /tmp/vorbis
          cd /tmp/vorbis && mkdir build && cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.IOS_MIN_VERSION }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ env.ARCH }} \
            -DCMAKE_INSTALL_PREFIX=$DEPS_DIR \
            -DCMAKE_PREFIX_PATH=$DEPS_DIR \
            -DCMAKE_FIND_ROOT_PATH=$DEPS_DIR \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(sysctl -n hw.ncpu) && cmake --install .

          # Build libtheora (autotools - no CMakeLists.txt in theora)
          git clone --depth 1 https://github.com/xiph/theora.git /tmp/theora
          cd /tmp/theora
          brew install automake libtool pkg-config || true
          ./autogen.sh
          ./configure \
            --host=arm-apple-darwin \
            --prefix=$DEPS_DIR \
            --disable-shared \
            --enable-static \
            --disable-examples \
            --disable-doc \
            --disable-spec \
            CFLAGS="$FLAGS" \
            LDFLAGS="$FLAGS" \
            PKG_CONFIG_PATH="$DEPS_DIR/lib/pkgconfig"
          make -j$(sysctl -n hw.ncpu) && make install

      - name: Build tinyxml2 for iOS
        run: |
          DEPS_DIR=${{ github.workspace }}/RSDKv5-Decompilation/ios-deps
          git clone --depth 1 https://github.com/leethomason/tinyxml2.git /tmp/tinyxml2
          cd /tmp/tinyxml2 && mkdir build && cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.IOS_MIN_VERSION }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ env.ARCH }} \
            -DCMAKE_INSTALL_PREFIX=$DEPS_DIR \
            -Dtinyxml2_BUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(sysctl -n hw.ncpu) && cmake --install .

      - name: Create Data.rsdk placeholder
        run: |
          mkdir -p RSDKv5-Decompilation/dependencies/RSDKv5/ios
          touch RSDKv5-Decompilation/dependencies/RSDKv5/ios/Data.rsdk

      - name: Create iOS CMakeLists.txt (Android one won't work)
        working-directory: RSDKv5-Decompilation
        run: |
          # Download tinyxml2 (gitignored in repo)
          mkdir -p dependencies/all/tinyxml2
          curl -sL https://raw.githubusercontent.com/leethomason/tinyxml2/master/tinyxml2.cpp -o dependencies/all/tinyxml2/tinyxml2.cpp
          curl -sL https://raw.githubusercontent.com/leethomason/tinyxml2/master/tinyxml2.h -o dependencies/all/tinyxml2/tinyxml2.h

          # Create platform compatibility header for iOS
          cat > RSDKv5/ios_compat.h << 'COMPAT'
          #ifndef IOS_COMPAT_H
          #ifndef _WIN32
          #include <climits>
          #ifndef MAX_PATH
          #define MAX_PATH PATH_MAX
          #endif
          typedef void* HINSTANCE;
          #endif
          #endif
          COMPAT

          # Comment out ShowErrorDialog calls (not declared in this fork, Windows-only)
          sed -i '' 's|^\([[:space:]]*\)RenderDevice::ShowErrorDialog|\1//RenderDevice::ShowErrorDialog|g' RSDKv5/RSDK/Core/RetroEngine.cpp

          # Create cocoaHelpers.hpp for iOS (missing from repo)
          cat > RSDKv5/cocoaHelpers.hpp << 'COCOA'
          #ifndef COCOAHELPERS_HPP
          #define COCOAHELPERS_HPP
          const char *getResourcesPath();
          #endif
          COCOA

          cat > RSDKv5/cocoaHelpers.mm << 'OBJC'
          #import <Foundation/Foundation.h>
          #include "cocoaHelpers.hpp"
          const char *getResourcesPath() {
              static NSString *path = nil;
              if (!path) {
                  NSArray *paths = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES);
                  path = [[paths firstObject] stringByAppendingString:@"/"];
              }
              return [path UTF8String];
          }
          OBJC

          cat > CMakeLists.txt << 'CMAKE'
          cmake_minimum_required(VERSION 3.14)
          project(RSDKv5_iOS LANGUAGES C CXX)

          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_C_STANDARD 11)

          set(DEPS_DIR ${CMAKE_SOURCE_DIR}/ios-deps)

          add_executable(RetroEngine
              RSDKv5/main.cpp
              RSDKv5/RSDK/Core/RetroEngine.cpp
              RSDKv5/RSDK/Core/Math.cpp
              RSDKv5/RSDK/Core/Reader.cpp
              RSDKv5/RSDK/Core/Link.cpp
              RSDKv5/RSDK/Core/ModAPI.cpp
              RSDKv5/RSDK/Dev/Debug.cpp
              RSDKv5/RSDK/Storage/Storage.cpp
              RSDKv5/RSDK/Storage/Text.cpp
              RSDKv5/RSDK/Graphics/Drawing.cpp
              RSDKv5/RSDK/Graphics/Scene3D.cpp
              RSDKv5/RSDK/Graphics/Animation.cpp
              RSDKv5/RSDK/Graphics/Sprite.cpp
              RSDKv5/RSDK/Graphics/Palette.cpp
              RSDKv5/RSDK/Graphics/Video.cpp
              RSDKv5/RSDK/Audio/Audio.cpp
              RSDKv5/RSDK/Input/Input.cpp
              RSDKv5/RSDK/Scene/Scene.cpp
              RSDKv5/RSDK/Scene/Collision.cpp
              RSDKv5/RSDK/Scene/Object.cpp
              RSDKv5/RSDK/Scene/Objects/DefaultObject.cpp
              RSDKv5/RSDK/Scene/Objects/DevOutput.cpp
              RSDKv5/RSDK/User/Core/UserAchievements.cpp
              RSDKv5/RSDK/User/Core/UserCore.cpp
              RSDKv5/RSDK/User/Core/UserLeaderboards.cpp
              RSDKv5/RSDK/User/Core/UserPresence.cpp
              RSDKv5/RSDK/User/Core/UserStats.cpp
              RSDKv5/RSDK/User/Core/UserStorage.cpp
              dependencies/all/tinyxml2/tinyxml2.cpp
              dependencies/all/iniparser/iniparser.cpp
              dependencies/all/iniparser/dictionary.cpp
              dependencies/all/miniz/miniz.c
              RSDKv5/cocoaHelpers.mm
          )

          target_include_directories(RetroEngine PRIVATE
              RSDKv5/
              ${DEPS_DIR}/include
              ${DEPS_DIR}/include/SDL2
              dependencies/all/
              dependencies/all/tinyxml2/
              dependencies/all/iniparser/
          )

          target_compile_definitions(RetroEngine PRIVATE
              RETRO_REVISION=3
              RETRO_USE_MOD_LOADER=1
              RETRO_USE_ORIGINAL_CODE=0
              SDL_MAIN_HANDLED
          )

          target_compile_options(RetroEngine PRIVATE -fexceptions -frtti -include ${CMAKE_SOURCE_DIR}/RSDKv5/ios_compat.h)

          target_link_libraries(RetroEngine
              "-L${DEPS_DIR}/lib"
              "-logg"
              "-ltheora"
              "-ltheoradec"
              "-lSDL2"
              "-framework UIKit"
              "-framework Foundation"
              "-framework Metal"
              "-framework OpenGLES"
              "-framework AudioToolbox"
              "-framework CoreAudio"
              "-framework CoreMotion"
              "-framework QuartzCore"
              "-framework GameController"
              "-lz"
          )
          CMAKE
          echo "Created iOS CMakeLists.txt"

      - name: Configure RSDKv5 (CMake)
        working-directory: RSDKv5-Decompilation
        run: |
          cmake -B build \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.IOS_MIN_VERSION }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ env.ARCH }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_FIND_ROOT_PATH="${{ github.workspace }}/RSDKv5-Decompilation/ios-deps" \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/RSDKv5-Decompilation/ios-deps" \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH

      - name: Build RSDKv5
        run: cmake --build RSDKv5-Decompilation/build -j$(sysctl -n hw.ncpu)

      - name: Package IPA
        run: |
          mkdir -p Payload/RSDKv5.app
          BINARY=$(find RSDKv5-Decompilation/build -name "RetroEngine" -type f ! -name "*.a" ! -name "*.dylib" | head -1)
          if [ -z "$BINARY" ]; then
            echo "ERROR: RetroEngine binary not found"
            find RSDKv5-Decompilation/build -type f -executable
            exit 1
          fi
          cp "$BINARY" Payload/RSDKv5.app/RetroEngine
          cat > Payload/RSDKv5.app/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleDisplayName</key><string>Sonic Mania</string>
            <key>CFBundleExecutable</key><string>RetroEngine</string>
            <key>CFBundleIdentifier</key><string>com.rsdkmodding.rsdkv5</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>Sonic Mania</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>DTPlatformName</key><string>iphoneos</string>
            <key>DTSDKName</key><string>iphoneos17.5</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>MinimumOSVersion</key><string>13.0</string>
            <key>UIDeviceFamily</key>
            <array>
              <integer>1</integer>
              <integer>2</integer>
            </array>
            <key>UIRequiresFullScreen</key><true/>
            <key>UILaunchStoryboardName</key><string></string>
            <key>UIRequiredDeviceCapabilities</key>
            <array>
              <string>arm64</string>
            </array>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
            <key>CFBundleSupportedPlatforms</key>
            <array>
              <string>iPhoneOS</string>
            </array>
          </dict>
          </plist>
          PLIST
          zip -r RSDKv5.ipa Payload
          echo "IPA size: $(du -h RSDKv5.ipa | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: RSDKv5-iOS-arm64
          path: RSDKv5.ipa
          retention-days: 30
