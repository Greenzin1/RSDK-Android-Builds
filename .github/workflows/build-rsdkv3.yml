name: Build RSDKv3 iOS (Sonic CD)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-rsdkv3.yml'
  workflow_dispatch:

env:
  IOS_MIN_VERSION: "13.0"
  ARCH: arm64

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Clone RSDKv3
        run: |
          git clone --recursive https://github.com/RSDKModding/RSDKv3-Decompilation.git
          cd RSDKv3-Decompilation
          git log --oneline -5

      - name: Setup iOS toolchain
        run: |
          echo "SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV
          echo "CC=$(xcrun -find clang)" >> $GITHUB_ENV
          echo "CXX=$(xcrun -find clang++)" >> $GITHUB_ENV

      - name: Create symlink for Xcode project
        run: |
          cd RSDKv3-Decompilation
          ln -sf RSDKv3 SonicCDDecomp

      - name: Fix cocoaHelpers for iOS (replace AppKit with Foundation)
        working-directory: RSDKv3-Decompilation
        run: |
          cat > dependencies/mac/cocoaHelpers.hpp << 'H'
          #ifndef COCOAHELPERS_HPP
          #define COCOAHELPERS_HPP
          void getResourcesPath(char* buffer, int bufferSize);
          const char *getDocumentsPath();
          #endif
          H
          cat > dependencies/mac/cocoaHelpers.mm << 'M'
          #ifdef __APPLE__
          #import <Foundation/Foundation.h>
          #include "cocoaHelpers.hpp"
          #include <sys/stat.h>

          const char *getDocumentsPath() {
              static NSString *path = nil;
              if (!path) {
                  NSArray *paths = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES);
                  path = [[paths firstObject] stringByAppendingString:@"/"];
              }
              return [path UTF8String];
          }

          void getResourcesPath(char* buffer, int bufferSize) {
              @autoreleasepool {
                  NSString *appFolder = [NSBundle.mainBundle.bundlePath stringByDeletingLastPathComponent];
                  NSString *dataFile = [appFolder stringByAppendingString:@"/Data.rsdk"];
                  NSString *dataFolder = [appFolder stringByAppendingString:@"/Data"];
                  NSString *settingsFile = [appFolder stringByAppendingString:@"/settings.ini"];
                  if([NSFileManager.defaultManager fileExistsAtPath:dataFile] ||
                     [NSFileManager.defaultManager fileExistsAtPath:settingsFile] ||
                     [NSFileManager.defaultManager fileExistsAtPath:dataFolder]){
                      [appFolder getCString:buffer maxLength:bufferSize encoding:NSUTF8StringEncoding];
                      return;
                  }
                  NSArray *paths = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES);
                  NSString *documentsDir = [paths firstObject];
                  [documentsDir getCString:buffer maxLength:bufferSize encoding:NSUTF8StringEncoding];
              }
          }
          #endif
          M
          echo "Replaced cocoaHelpers with iOS-compatible version"

      - name: Build SDL2 for iOS
        run: |
          git clone --depth 1 --branch release-2.30.0 https://github.com/libsdl-org/SDL.git /tmp/SDL2
          cd /tmp/SDL2
          mkdir build-ios && cd build-ios
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.IOS_MIN_VERSION }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ env.ARCH }} \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/RSDKv3-Decompilation/ios-deps \
            -DSDL_STATIC=ON \
            -DSDL_SHARED=OFF \
            -DSDL_TEST=OFF \
            -DSDL_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(sysctl -n hw.ncpu)
          cmake --install .

      - name: Build libogg + libvorbis + libtheora for iOS
        run: |
          DEPS_DIR=${{ github.workspace }}/RSDKv3-Decompilation/ios-deps
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          FLAGS="-arch ${{ env.ARCH }} -isysroot $SDK -miphoneos-version-min=${{ env.IOS_MIN_VERSION }}"

          # Build libogg (cmake)
          git clone --depth 1 https://github.com/xiph/ogg.git /tmp/ogg
          cd /tmp/ogg && mkdir build && cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.IOS_MIN_VERSION }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ env.ARCH }} \
            -DCMAKE_INSTALL_PREFIX=$DEPS_DIR \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(sysctl -n hw.ncpu) && cmake --install .

          # Build libvorbis (cmake)
          git clone --depth 1 https://github.com/xiph/vorbis.git /tmp/vorbis
          cd /tmp/vorbis && mkdir build && cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.IOS_MIN_VERSION }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ env.ARCH }} \
            -DCMAKE_INSTALL_PREFIX=$DEPS_DIR \
            -DCMAKE_PREFIX_PATH=$DEPS_DIR \
            -DCMAKE_FIND_ROOT_PATH=$DEPS_DIR \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(sysctl -n hw.ncpu) && cmake --install .

          # Build libtheora (autotools - no CMakeLists.txt in theora)
          git clone --depth 1 https://github.com/xiph/theora.git /tmp/theora
          cd /tmp/theora
          brew install automake libtool pkg-config || true
          ./autogen.sh
          ./configure \
            --host=arm-apple-darwin \
            --prefix=$DEPS_DIR \
            --disable-shared \
            --enable-static \
            --disable-examples \
            --disable-doc \
            --disable-spec \
            CFLAGS="$FLAGS" \
            LDFLAGS="$FLAGS" \
            PKG_CONFIG_PATH="$DEPS_DIR/lib/pkgconfig"
          make -j$(sysctl -n hw.ncpu) && make install

      - name: Build tinyxml2 for iOS
        run: |
          DEPS_DIR=${{ github.workspace }}/RSDKv3-Decompilation/ios-deps
          git clone --depth 1 https://github.com/leethomason/tinyxml2.git /tmp/tinyxml2
          cd /tmp/tinyxml2 && mkdir build && cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.IOS_MIN_VERSION }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ env.ARCH }} \
            -DCMAKE_INSTALL_PREFIX=$DEPS_DIR \
            -Dtinyxml2_BUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(sysctl -n hw.ncpu) && cmake --install .

      - name: Create SDLMain stub
        working-directory: RSDKv3-Decompilation
        run: |
          mkdir -p dependencies/ios
          echo 'void SDLMain_stub(void){}' > /tmp/sdlmain.c
          xcrun -sdk iphoneos clang -arch ${{ env.ARCH }} -miphoneos-version-min=${{ env.IOS_MIN_VERSION }} -c /tmp/sdlmain.c -o /tmp/sdlmain.o
          ar rcs dependencies/ios/libSDLMain.a /tmp/sdlmain.o

      - name: Build ModAPI stub
        run: |
          cd RSDKv3-Decompilation
          mkdir -p ios-deps
          cat > /tmp/modapi_stub.cpp << 'STUB'
          #include <cstdint>
          extern "C" {
            int32_t ModAPI_GetCurrentLoadedMod() { return 0; }
            void ModAPI_SetupModInfo() {}
          }
          STUB
          xcrun -sdk iphoneos clang++ -arch ${{ env.ARCH }} \
            -std=gnu++14 -miphoneos-version-min=${{ env.IOS_MIN_VERSION }} \
            -c /tmp/modapi_stub.cpp -o /tmp/modapi_stub.o
          ar rcs ios-deps/libModAPIStub.a /tmp/modapi_stub.o

      - name: Create Data.rsdk placeholder
        run: touch RSDKv3-Decompilation/dependencies/ios/Data.rsdk

      - name: Build RSDKv3
        working-directory: RSDKv3-Decompilation
        run: |
          xcodebuild -project "RSDKv3 ios.xcodeproj" \
            -scheme "RSDKv3" \
            -configuration Release \
            -sdk iphoneos \
            -arch ${{ env.ARCH }} \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            FRAMEWORK_SEARCH_PATHS="$(pwd)/dependencies/ios" \
            LIBRARY_SEARCH_PATHS="$(pwd)/dependencies/ios $(pwd)/ios-deps/lib $(pwd)/ios-deps" \
            OTHER_LDFLAGS="-lModAPIStub -ltinyxml2 -framework AVFoundation -framework AudioToolbox -framework CoreAudio -framework CoreBluetooth -framework CoreGraphics -framework CoreHaptics -framework CoreMotion -framework Foundation -framework GameController -framework Metal -framework OpenGLES -framework QuartzCore -framework UIKit" \
            HEADER_SEARCH_PATHS="$(pwd)/ios-deps/include $(pwd)/ios-deps/include/SDL2 $(pwd)/ios-deps/include/vorbis $(pwd)/ios-deps/include/ogg $(pwd)/ios-deps/include/theora $(pwd)/ios-deps/include/tinyxml2 $(pwd)/SonicCDDecomp $(pwd)/dependencies/all/theoraplay" \
            'GCC_PREPROCESSOR_DEFINITIONS=RETRO_USING_OPENGL=0 $(inherited)' \
            OTHER_CFLAGS="-Wno-deprecated-declarations -Wno-nonportable-include-path"

      - name: Package IPA
        run: |
          APP_DIR=$(find RSDKv3-Decompilation/build -name "RSDKv3.app" -path "*/iphoneos/*" | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "ERROR: RSDKv3.app not found"
            find RSDKv3-Decompilation/build -name "*.app" -type d
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_DIR" Payload/
          zip -r RSDKv3.ipa Payload
          echo "IPA size: $(du -h RSDKv3.ipa | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: RSDKv3-iOS-arm64
          path: RSDKv3.ipa
          retention-days: 30
