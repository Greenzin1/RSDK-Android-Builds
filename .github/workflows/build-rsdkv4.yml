name: Build RSDKv4 iOS (Sonic 1 & 2)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-rsdkv4.yml'
  workflow_dispatch:

env:
  IOS_MIN_VERSION: "13.0"
  ARCH: arm64

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Clone RSDKv4
        run: |
          git clone --recursive https://github.com/RSDKModding/RSDKv4-Decompilation.git
          cd RSDKv4-Decompilation
          git log --oneline -5

      - name: Setup iOS toolchain
        run: |
          echo "SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV
          echo "CC=$(xcrun -find clang)" >> $GITHUB_ENV
          echo "CXX=$(xcrun -find clang++)" >> $GITHUB_ENV

      - name: Create symlink for Xcode project
        run: |
          cd RSDKv4-Decompilation
          ln -sf RSDKv4 Sonic12Decomp

      - name: Build SDL2 for iOS
        run: |
          git clone --depth 1 --branch release-2.30.0 https://github.com/libsdl-org/SDL.git /tmp/SDL2
          cd /tmp/SDL2
          mkdir build-ios && cd build-ios
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.IOS_MIN_VERSION }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ env.ARCH }} \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/RSDKv4-Decompilation/ios-deps \
            -DSDL_STATIC=ON \
            -DSDL_SHARED=OFF \
            -DSDL_TEST=OFF \
            -DSDL_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(sysctl -n hw.ncpu)
          cmake --install .

      - name: Build libogg + libvorbis for iOS
        run: |
          DEPS_DIR=${{ github.workspace }}/RSDKv4-Decompilation/ios-deps

          git clone --depth 1 https://github.com/xiph/ogg.git /tmp/ogg
          cd /tmp/ogg && mkdir build && cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.IOS_MIN_VERSION }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ env.ARCH }} \
            -DCMAKE_INSTALL_PREFIX=$DEPS_DIR \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(sysctl -n hw.ncpu) && cmake --install .

          git clone --depth 1 https://github.com/xiph/vorbis.git /tmp/vorbis
          cd /tmp/vorbis && mkdir build && cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.IOS_MIN_VERSION }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ env.ARCH }} \
            -DCMAKE_INSTALL_PREFIX=$DEPS_DIR \
            -DCMAKE_PREFIX_PATH=$DEPS_DIR \
            -DCMAKE_FIND_ROOT_PATH=$DEPS_DIR \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(sysctl -n hw.ncpu) && cmake --install .

      - name: Build tinyxml2 for iOS
        run: |
          DEPS_DIR=${{ github.workspace }}/RSDKv4-Decompilation/ios-deps
          git clone --depth 1 https://github.com/leethomason/tinyxml2.git /tmp/tinyxml2
          cd /tmp/tinyxml2 && mkdir build && cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.IOS_MIN_VERSION }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ env.ARCH }} \
            -DCMAKE_INSTALL_PREFIX=$DEPS_DIR \
            -Dtinyxml2_BUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(sysctl -n hw.ncpu) && cmake --install .

      - name: Create NativeObjects symlinks (Xcode project has wrong paths)
        working-directory: RSDKv4-Decompilation
        run: |
          for f in RSDKv4/NativeObjects/*.cpp RSDKv4/NativeObjects/*.hpp; do
            base=$(basename "$f")
            if [ ! -e "RSDKv4/$base" ]; then
              ln -s "NativeObjects/$base" "RSDKv4/$base"
              echo "Linked: RSDKv4/$base -> NativeObjects/$base"
            fi
          done

      - name: Create SDLMain stub and framework symlink
        working-directory: RSDKv4-Decompilation
        run: |
          # The Xcode project expects libSDLMain.a - create proper SDLMain entry point
          cat > /tmp/sdlmain.c << 'EOF'
          #include <SDL2/SDL_main.h>
          #ifdef main
          #undef main
          #endif
          extern int SDL_main(int argc, char *argv[]);
          int main(int argc, char *argv[]) {
              return SDL_main(argc, argv);
          }
          EOF
          xcrun -sdk iphoneos clang -arch ${{ env.ARCH }} -miphoneos-version-min=${{ env.IOS_MIN_VERSION }} \
            -Iios-deps/include/SDL2 -c /tmp/sdlmain.c -o /tmp/sdlmain.o
          mkdir -p dependencies/ios
          ar rcs dependencies/ios/libSDLMain.a /tmp/sdlmain.o
          # Create SDL2.framework structure pointing to our built SDL2
          mkdir -p dependencies/ios/SDL2.framework/Headers
          cp ios-deps/include/SDL2/*.h dependencies/ios/SDL2.framework/Headers/
          ln -sf $(pwd)/ios-deps/lib/libSDL2.a dependencies/ios/SDL2.framework/SDL2
          # Create Ogg.framework and Vorbis.framework
          for name in Ogg Vorbis; do
            mkdir -p "dependencies/ios/${name}.framework/Headers"
            cp "ios-deps/lib/lib${name}.a" "dependencies/ios/${name}.framework/${name}"
          done
          cp ios-deps/include/ogg/* dependencies/ios/Ogg.framework/Headers/ 2>/dev/null || true
          cp ios-deps/include/vorbis/* dependencies/ios/Vorbis.framework/Headers/ 2>/dev/null || true

      - name: Create Data.rsdk placeholder
        run: touch RSDKv4-Decompilation/dependencies/ios/Data.rsdk

      - name: Build RSDKv4
        working-directory: RSDKv4-Decompilation
        run: |
          xcodebuild -project "RSDKv4 ios.xcodeproj" \
            -scheme "RSDKv4" \
            -configuration Release \
            -sdk iphoneos \
            -arch ${{ env.ARCH }} \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            LIBRARY_SEARCH_PATHS="$(pwd)/dependencies/ios $(pwd)/ios-deps/lib $(pwd)/ios-deps" \
            HEADER_SEARCH_PATHS="$(pwd)/ios-deps/include $(pwd)/ios-deps/include/SDL2 $(pwd)/ios-deps/include/vorbis $(pwd)/ios-deps/include/ogg $(pwd)/RSDKv4 $(pwd)/RSDKv4/NativeObjects $(pwd)/dependencies/all/theoraplay" \
            'GCC_PREPROCESSOR_DEFINITIONS=RETRO_USING_OPENGL=0 $(inherited)' \
            OTHER_CFLAGS="-Wno-deprecated-declarations" \
            OTHER_LDFLAGS="-framework AVFoundation -framework AudioToolbox -framework CoreAudio -framework CoreBluetooth -framework CoreGraphics -framework CoreHaptics -framework CoreMotion -framework Foundation -framework GameController -framework Metal -framework OpenGLES -framework QuartzCore -framework UIKit"

      - name: Package IPA
        run: |
          APP_DIR=$(find RSDKv4-Decompilation/build -name "RSDKv4.app" -path "*/iphoneos/*" | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "ERROR: RSDKv4.app not found"
            find RSDKv4-Decompilation/build -name "*.app" -type d
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_DIR" Payload/
          zip -r RSDKv4.ipa Payload
          echo "IPA size: $(du -h RSDKv4.ipa | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: RSDKv4-iOS-arm64
          path: RSDKv4.ipa
          retention-days: 30
