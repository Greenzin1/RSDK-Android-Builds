name: Build RSDKv2 Android (Sonic Nexus)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-rsdkv2-android.yml'
  workflow_dispatch:

env:
  ANDROID_NDK_VERSION: "26.1.10909125"
  ANDROID_API: 21
  ANDROID_BUILD_TOOLS: "34.0.0"
  ABI: arm64-v8a

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install NDK
        run: |
          sdkmanager "ndk;${{ env.ANDROID_NDK_VERSION }}" "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" "platforms;android-${{ env.ANDROID_API }}" "platforms;android-31"
          echo "NDK_PATH=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV

      - name: Clone RSDKv2
        run: git clone --recursive https://github.com/RSDKModding/RSDKv2-Decompilation.git

      - name: Create Android.cmake
        working-directory: RSDKv2-Decompilation
        run: |
          cat > platforms/Android.cmake << 'CMAKE'
          add_library(RetroEngine SHARED ${RETRO_FILES})

          set(SDL2_DIR "${CMAKE_SOURCE_DIR}/android-deps/SDL2")
          target_include_directories(RetroEngine PRIVATE
              ${SDL2_DIR}/include
              ${SDL2_DIR}/include/SDL2
          )

          add_library(SDL2 SHARED IMPORTED)
          set_target_properties(SDL2 PROPERTIES IMPORTED_LOCATION ${SDL2_DIR}/lib/${ANDROID_ABI}/libSDL2.so)
          target_include_directories(SDL2 INTERFACE ${SDL2_DIR}/include ${SDL2_DIR}/include/SDL2)

          # Pre-built static libs from android-deps
          set(DEPS "${CMAKE_SOURCE_DIR}/android-deps")
          add_library(ogg STATIC IMPORTED)
          set_target_properties(ogg PROPERTIES IMPORTED_LOCATION ${DEPS}/lib/${ANDROID_ABI}/libogg.a)
          target_include_directories(ogg INTERFACE ${DEPS}/include)

          add_library(vorbis STATIC IMPORTED)
          set_target_properties(vorbis PROPERTIES IMPORTED_LOCATION ${DEPS}/lib/${ANDROID_ABI}/libvorbis.a)
          target_include_directories(vorbis INTERFACE ${DEPS}/include)

          add_library(vorbisfile STATIC IMPORTED)
          set_target_properties(vorbisfile PROPERTIES IMPORTED_LOCATION ${DEPS}/lib/${ANDROID_ABI}/libvorbisfile.a)
          target_include_directories(vorbisfile INTERFACE ${DEPS}/include)

          target_link_libraries(RetroEngine SDL2 ogg vorbis vorbisfile log android EGL GLESv2 GLESv1_CM OpenSLES)
          target_include_directories(RetroEngine PRIVATE ${DEPS}/include)

          # Disable bundled source compilation
          set(COMPILE_OGG OFF CACHE BOOL "" FORCE)
          set(COMPILE_VORBIS OFF CACHE BOOL "" FORCE)

          target_compile_definitions(RetroEngine PRIVATE RETRO_PLATFORM=RETRO_ANDROID)

          set_target_properties(RetroEngine PROPERTIES
              CXX_STANDARD 17
              CXX_STANDARD_REQUIRED ON
              OUTPUT_NAME "RSDKv2"
          )
          CMAKE

      - name: Create Android helpers
        working-directory: RSDKv2-Decompilation
        run: |
          cat > RSDKv2/androidHelpers.hpp << 'H'
          #ifndef ANDROIDHELPERS_HPP
          #define ANDROIDHELPERS_HPP
          #include <SDL.h>
          const char *getDocumentsPath();
          const char *getResourcesPath();
          void nativeSetKeyState(int scancode, int pressed);
          #endif
          H
          cat > RSDKv2/androidHelpers.cpp << 'C'
          #include <string.h>
          #include <jni.h>
          #include "RetroEngine.hpp"
          #include <SDL.h>
          static char docsPath[512] = {0};
          static char resPath[512] = {0};
          extern "C" void android_setPaths(const char* docs, const char* res) {
              if (docs) strncpy(docsPath, docs, sizeof(docsPath) - 1);
              if (res) strncpy(resPath, res, sizeof(resPath) - 1);
          }
          const char *getDocumentsPath() {
              if (!docsPath[0]) return "/sdcard/RSDK/v2/";
              return docsPath;
          }
          const char *getResourcesPath() {
              if (!resPath[0]) return "/sdcard/RSDK/v2/";
              return resPath;
          }
          extern "C" void Java_com_rsdkmodding_rsdkv2_RSDKv2_nativeSetKeyState(JNIEnv *env, jclass cls, jint scancode, jint pressed) {
              int numkeys = 0;
              const Uint8 *state = SDL_GetKeyboardState(&numkeys);
              if (scancode >= 0 && scancode < numkeys) {
                  ((Uint8*)state)[scancode] = pressed ? 1 : 0;
              }
          }
          C

      - name: Patch RetroEngine.hpp for Android
        working-directory: RSDKv2-Decompilation
        run: |
          python3 << 'PYEOF'
          path = 'RSDKv2/RetroEngine.hpp'
          with open(path) as f: content = f.read()
          content = content.replace(
              '#define RETRO_PLATFORM (RETRO_WIN) // Default',
              '#ifndef RETRO_PLATFORM\n#if defined(__ANDROID__)\n#define RETRO_PLATFORM (RETRO_ANDROID)\n#else\n#define RETRO_PLATFORM (RETRO_WIN)\n#endif\n#endif'
          )
          content = content.replace(
              '#elif RETRO_PLATFORM == RETRO_iOS\n#include <SDL2/SDL.h>\n#include <vorbis/vorbisfile.h>\n\n#include "cocoaHelpers.hpp"',
              '#elif RETRO_PLATFORM == RETRO_ANDROID\n#include "androidHelpers.hpp"'
          )
          content = content.replace(
              '#if RETRO_PLATFORM == RETRO_WIN || RETRO_PLATFORM == RETRO_OSX || RETRO_PLATFORM == RETRO_iOS || RETRO_PLATFORM == RETRO_UWP',
              '#if RETRO_PLATFORM == RETRO_WIN || RETRO_PLATFORM == RETRO_OSX || RETRO_PLATFORM == RETRO_iOS || RETRO_PLATFORM == RETRO_UWP || RETRO_PLATFORM == RETRO_ANDROID'
          )
          content = content.replace('#include <SDL2/SDL.h>', '#include <SDL.h>')
          # Disable mod loader on Android (std::filesystem crashes on /)
          content = content.replace(
              '#if !RETRO_USE_ORIGINAL_CODE\n#undef RETRO_USE_MOD_LOADER\n#define RETRO_USE_MOD_LOADER (1)\n#endif',
              '#if !RETRO_USE_ORIGINAL_CODE && RETRO_PLATFORM != RETRO_ANDROID\n#undef RETRO_USE_MOD_LOADER\n#define RETRO_USE_MOD_LOADER (1)\n#endif'
          )
          with open(path, 'w') as f: f.write(content)
          print('RetroEngine.hpp patched for Android')

          # Fix LoadActFile and LoadStageFile dest buffer overflow in Scene.cpp
          scene_path = 'RSDKv2/Scene.cpp'
          with open(scene_path) as f: scene = f.read()
          scene = scene.replace('int LoadActFile(const char *ext, int stageID, FileInfo *info) {\n    char dest[0x40];',
                                'int LoadActFile(const char *ext, int stageID, FileInfo *info) {\n    char dest[0x100];')
          scene = scene.replace('int LoadStageFile(const char *filePath, int stageID, FileInfo *info) {\n    char dest[0x40];',
                                'int LoadStageFile(const char *filePath, int stageID, FileInfo *info) {\n    char dest[0x100];')
          with open(scene_path, 'w') as f: f.write(scene)
          print('Fixed dest buffer overflow in Scene.cpp (LoadActFile + LoadStageFile)')

          # Enable devMenu by default on Android
          with open('RSDKv2/RetroEngine.cpp') as f: eng = f.read()
          eng = eng.replace(
              'bool RetroEngine::LoadGameConfig(const char *filePath) {',
              '#if RETRO_PLATFORM == RETRO_ANDROID\nstatic bool _devMenuSet = false;\n#endif\nbool RetroEngine::LoadGameConfig(const char *filePath) {'
          )
          with open('RSDKv2/RetroEngine.cpp', 'w') as f: f.write(eng)
          print('Added devMenu init hook for Android')

          # Patch main.cpp to enable devMenu on Android
          with open('RSDKv2/main.cpp') as f: main_cpp = f.read()
          main_cpp = main_cpp.replace(
              'Engine.devMenu        = true;',
              'Engine.devMenu        = true;\n#endif\n#if RETRO_PLATFORM == RETRO_ANDROID\n    Engine.devMenu = true;'
          )
          with open('RSDKv2/main.cpp', 'w') as f: f.write(main_cpp)
          print('Enabled devMenu by default on Android')

          # Patch RetroEngine.cpp to use getDocumentsPath() on Android for data file
          path2 = 'RSDKv2/RetroEngine.cpp'
          with open(path2) as f: c = f.read()
          c = c.replace(
              '#else\n    StrCopy(dest, BASE_PATH);\n    StrAdd(dest, Engine.dataFile);\n#endif\n    CheckBinFile(dest);',
              '#elif RETRO_PLATFORM == RETRO_ANDROID\n    StrCopy(dest, getDocumentsPath());\n    StrAdd(dest, Engine.dataFile);\n    SDL_Log(\"[RSDK] Data path: %s\", dest);\n#else\n    StrCopy(dest, BASE_PATH);\n    StrAdd(dest, Engine.dataFile);\n#endif\n    SDL_Log(\"[RSDK] CheckBinFile result: %d\", CheckBinFile(dest));'
          )
          c = c.replace(
              'sprintf(gamePath, "%s", BASE_PATH);',
              '#if RETRO_PLATFORM == RETRO_ANDROID\n    sprintf(gamePath, "%s", getDocumentsPath());\n#else\n    sprintf(gamePath, "%s", BASE_PATH);\n#endif'
          )
          # Patch LoadGameConfig result
          c = c.replace(
              'if (LoadGameConfig("Data/Game/GameConfig.bin")) {',
              'bool gcResult = LoadGameConfig("Data/Game/GameConfig.bin"); SDL_Log("[RSDK] LoadGameConfig: %d", gcResult);\n    if (gcResult) {'
          )
          with open(path2, 'w') as f: f.write(c)
          print('RetroEngine.cpp patched for Android data path')

          # Fix buffer overflows in RetroEngine.cpp (stage list and GameConfig)
          with open(path2) as f: engine = f.read()

          # Fix stage list folder/id/name overflow
          engine = engine.replace(
              '                // Read Stage Folder\n                FileRead(&fileBuffer, 1);\n                FileRead(&stageList[cat][s].folder, fileBuffer);\n                stageList[cat][s].folder[fileBuffer] = 0;\n\n                // Read Stage ID\n                FileRead(&fileBuffer, 1);\n                FileRead(&stageList[cat][s].id, fileBuffer);\n                stageList[cat][s].id[fileBuffer] = 0;\n\n                // Read Stage Name\n                FileRead(&fileBuffer, 1);\n                FileRead(&stageList[cat][s].name, fileBuffer);\n                stageList[cat][s].name[fileBuffer] = 0;',
              '                // Read Stage Folder\n                FileRead(&fileBuffer, 1);\n                if (fileBuffer > 0x3F) fileBuffer = 0x3F;\n                FileRead(&stageList[cat][s].folder, fileBuffer);\n                stageList[cat][s].folder[fileBuffer] = 0;\n\n                // Read Stage ID\n                FileRead(&fileBuffer, 1);\n                if (fileBuffer > 0x3F) fileBuffer = 0x3F;\n                FileRead(&stageList[cat][s].id, fileBuffer);\n                stageList[cat][s].id[fileBuffer] = 0;\n\n                // Read Stage Name\n                FileRead(&fileBuffer, 1);\n                if (fileBuffer > 0x3F) fileBuffer = 0x3F;\n                FileRead(&stageList[cat][s].name, fileBuffer);\n                stageList[cat][s].name[fileBuffer] = 0;'
          )

          # Fix GameConfig reading overflow
          engine = engine.replace(
              '    if (LoadFile(filePath, &info)) {\n        FileRead(&fileBuffer, 1);\n        FileRead(GameWindowText, fileBuffer);\n        GameWindowText[fileBuffer] = 0;\n\n        FileRead(&fileBuffer, 1);\n        FileRead(&data, fileBuffer); // Load \'Data\'\n        data[fileBuffer] = 0;\n\n        FileRead(&fileBuffer, 1);\n        FileRead(GameDescriptionText, fileBuffer);\n        GameDescriptionText[fileBuffer] = 0;',
              '    if (LoadFile(filePath, &info)) {\n        FileRead(&fileBuffer, 1);\n        if (fileBuffer > 0x3F) fileBuffer = 0x3F;\n        FileRead(GameWindowText, fileBuffer);\n        GameWindowText[fileBuffer] = 0;\n\n        FileRead(&fileBuffer, 1);\n        if (fileBuffer > 0x3F) fileBuffer = 0x3F;\n        FileRead(&data, fileBuffer); // Load \'Data\'\n        data[fileBuffer] = 0;\n\n        FileRead(&fileBuffer, 1);\n        if (fileBuffer > 0xFF) fileBuffer = 0xFF;\n        FileRead(GameDescriptionText, fileBuffer);\n        GameDescriptionText[fileBuffer] = 0;'
          )

          # Fix GlobalVariableNames overflow
          engine = engine.replace(
              '            // Read Variable Name\n            FileRead(&fileBuffer, 1);\n            FileRead(&GlobalVariableNames[v], fileBuffer);\n            GlobalVariableNames[v][fileBuffer] = 0;',
              '            // Read Variable Name\n            FileRead(&fileBuffer, 1);\n            if (fileBuffer > 0x1F) fileBuffer = 0x1F;\n            FileRead(&GlobalVariableNames[v], fileBuffer);\n            GlobalVariableNames[v][fileBuffer] = 0;'
          )

          with open(path2, 'w') as f: f.write(engine)
          print('Fixed buffer overflows in RetroEngine.cpp')

          # Patch Userdata.cpp - gamePath and settings.ini
          path3 = 'RSDKv2/Userdata.cpp'
          with open(path3) as f: u = f.read()
          u = u.replace(
              'sprintf(gamePath, "%s", BASE_PATH);',
              '#if RETRO_PLATFORM == RETRO_ANDROID\n    sprintf(gamePath, "%s", getDocumentsPath());\n#else\n    sprintf(gamePath, "%s", BASE_PATH);\n#endif'
          )
          u = u.replace(
              '#elif RETRO_PLATFORM == RETRO_iOS\n    sprintf(buffer, "%s/settings.ini", getDocumentsPath());\n#else\n    sprintf(buffer, BASE_PATH"settings.ini");',
              '#elif RETRO_PLATFORM == RETRO_iOS\n    sprintf(buffer, "%s/settings.ini", getDocumentsPath());\n#elif RETRO_PLATFORM == RETRO_ANDROID\n    sprintf(buffer, "%s/settings.ini", getDocumentsPath());\n#else\n    sprintf(buffer, BASE_PATH"settings.ini");'
          )
          with open(path3, 'w') as f: f.write(u)
          print('Userdata.cpp patched for Android gamePath + settings path')

          # Add androidHelpers.cpp to CMakeLists.txt source list
          cmake_path = 'CMakeLists.txt'
          with open(cmake_path) as f: cm = f.read()
          if 'androidHelpers.cpp' not in cm:
              cm = cm.replace(
                  'RSDKv2/fcaseopen.c',
                  'RSDKv2/fcaseopen.c\n\tRSDKv2/androidHelpers.cpp'
              )
              with open(cmake_path, 'w') as f: f.write(cm)
              print('Added androidHelpers.cpp to CMakeLists.txt')
          PYEOF

      - name: Build SDL2 for Android
        run: |
          git clone --depth 1 --branch release-2.30.12 https://github.com/libsdl-org/SDL.git /tmp/SDL2
          cd /tmp/SDL2
          mkdir build-android && cd build-android
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ env.ABI }} \
            -DANDROID_PLATFORM=android-${{ env.ANDROID_API }} \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST=OFF -DSDL_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(nproc)
          DEP=${{ github.workspace }}/RSDKv2-Decompilation/android-deps/SDL2
          mkdir -p $DEP/lib/${{ env.ABI }}
          cp libSDL2.so $DEP/lib/${{ env.ABI }}/
          cp -r include $DEP/
          find . -name "SDL_config.h" -exec cp {} $DEP/include/SDL2/ \;
          ls $DEP/include/SDL2/SDL_config.h

      - name: Build libogg + libvorbis for Android
        run: |
          DEPS_DIR=${{ github.workspace }}/RSDKv2-Decompilation/android-deps
          TC=$NDK_PATH/build/cmake/android.toolchain.cmake
          git clone --depth 1 https://github.com/xiph/ogg.git /tmp/ogg
          cd /tmp/ogg && mkdir build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$TC -DANDROID_ABI=${{ env.ABI }} -DANDROID_PLATFORM=android-${{ env.ANDROID_API }} -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$DEPS_DIR -DCMAKE_SYSROOT=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          cmake --build . -j$(nproc) && cmake --install .
          git clone --depth 1 https://github.com/xiph/vorbis.git /tmp/vorbis
          cd /tmp/vorbis && mkdir build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$TC -DANDROID_ABI=${{ env.ABI }} -DANDROID_PLATFORM=android-${{ env.ANDROID_API }} -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$DEPS_DIR -DCMAKE_INSTALL_PREFIX=$DEPS_DIR -DOGG_INCLUDE_DIR=$DEPS_DIR/include -DOGG_LIBRARY=$DEPS_DIR/lib/${{ env.ABI }}/libogg.a -DBUILD_TESTING=OFF
          cmake --build . -j$(nproc) --target vorbis vorbisfile vorbisenc && cmake --install .
          mkdir -p $DEPS_DIR/lib/${{ env.ABI }}
          for lib in libogg.a libvorbis.a libvorbisfile.a libvorbisenc.a; do
            if [ -f $DEPS_DIR/lib/${{ env.ABI }}/$lib ]; then
              echo "$lib already in ABI dir"
            elif [ -f $DEPS_DIR/lib/$lib ]; then
              cp $DEPS_DIR/lib/$lib $DEPS_DIR/lib/${{ env.ABI }}/
              echo "Copied $lib from flat dir"
            else
              echo "WARNING: $lib not found anywhere!"
              find $DEPS_DIR -name "$lib" 2>/dev/null
            fi
          done
          ls -la $DEPS_DIR/lib/${{ env.ABI }}/

      - name: Build RSDKv2
        working-directory: RSDKv2-Decompilation
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ env.ABI }} \
            -DANDROID_PLATFORM=android-${{ env.ANDROID_API }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DRETRO_MOD_LOADER=OFF -DFORCE_CASE_INSENSITIVE=ON
          cmake --build build -j$(nproc)

      - name: Download SDL2 Java sources
        run: |
          mkdir -p /tmp/sdl2-java/org/libsdl/app
          find /tmp/SDL2 -path "*/org/libsdl/app/*.java" -exec cp {} /tmp/sdl2-java/org/libsdl/app/ \;
          ls /tmp/sdl2-java/org/libsdl/app/

      - name: Build APK
        run: |
          BT="$ANDROID_HOME/build-tools/${{ env.ANDROID_BUILD_TOOLS }}"
          AJAR="$ANDROID_HOME/platforms/android-${{ env.ANDROID_API }}/android.jar"
          WORK=${{ github.workspace }}/RSDKv2-Decompilation
          APK=/tmp/apk
          rm -rf $APK /tmp/unsigned.apk /tmp/aligned.apk $WORK/RSDKv2.apk
          mkdir -p $APK/lib/${{ env.ABI }} $APK/res/values $APK/java/com/rsdkmodding/rsdkv2

          # Find the .so
          SO=$(find $WORK/build -name "libRSDKv2.so" | head -1)
          if [ -z "$SO" ]; then echo "ERROR: libRSDKv2.so not found"; find $WORK/build -name "*.so"; exit 1; fi
          cp "$SO" $APK/lib/${{ env.ABI }}/

          # Copy libSDL2.so
          SDL2SO=$(find $WORK/android-deps/SDL2 -name "libSDL2.so" | head -1)
          if [ -z "$SDL2SO" ]; then echo "ERROR: libSDL2.so not found"; find $WORK/android-deps -name "*.so"; exit 1; fi
          cp "$SDL2SO" $APK/lib/${{ env.ABI }}/

          # AndroidManifest.xml
          cat > $APK/AndroidManifest.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.rsdkmodding.rsdkv2"
              android:versionCode="1" android:versionName="1.0">
              <uses-feature android:glEsVersion="0x00020000" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <application android:label="Sonic Nexus" android:hasCode="true" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity android:name="com.rsdkmodding.rsdkv2.RSDKv2"
                      android:label="Sonic Nexus"
                      android:configChanges="orientation|keyboardHidden|screenSize|screenLayout|smallestScreenSize"
                      android:launchMode="singleInstance"
                      android:screenOrientation="sensorLandscape"
                      android:exported="true"
                      android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <meta-data android:name="android.app.lib_name" android:value="RSDKv2" />
                  </activity>
              </application>
          </manifest>
          XML

          cat > $APK/res/values/strings.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">Sonic Nexus</string></resources>
          XML

          # Custom Activity with visible gamepad overlay
          cat > $APK/java/com/rsdkmodding/rsdkv2/RSDKv2.java << 'JAVA'
          package com.rsdkmodding.rsdkv2;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.os.Bundle;
          import android.os.Environment;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import java.io.File;
          import org.libsdl.app.SDLActivity;

          public class RSDKv2 extends SDLActivity {
              private static final int PERMISSION_REQUEST = 1;
              private GamePadOverlay overlay;

              static { System.loadLibrary("RSDKv2"); }
              private static native void nativeSetKeyState(int scancode, int pressed);

              private static final int SCAN_UP = 82;
              private static final int SCAN_DOWN = 81;
              private static final int SCAN_LEFT = 80;
              private static final int SCAN_RIGHT = 79;
              private static final int SCAN_A = 4;
              private static final int SCAN_S = 22;
              private static final int SCAN_D = 7;
              private static final int SCAN_RETURN = 40;
              private static final int SCAN_ESC = 41;

              private boolean[] zonePressed = new boolean[9];
              private static final int ZONE_UP = 0;
              private static final int ZONE_DOWN = 1;
              private static final int ZONE_LEFT = 2;
              private static final int ZONE_RIGHT = 3;
              private static final int ZONE_A = 4;
              private static final int ZONE_B = 5;
              private static final int ZONE_C = 6;
              private static final int ZONE_START = 7;
              private static final int ZONE_ESC = 8;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN);

                  // Add visible gamepad overlay
                  overlay = new GamePadOverlay(this);
                  addContentView(overlay, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT));

                  requestPermissions(new String[]{
                      Manifest.permission.READ_EXTERNAL_STORAGE,
                      Manifest.permission.WRITE_EXTERNAL_STORAGE
                  }, PERMISSION_REQUEST);
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN);
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  setupDirs();
              }

              private void setupDirs() {
                  String path = Environment.getExternalStorageDirectory().getAbsolutePath() + "/RSDK/v2";
                  new File(path).mkdirs();
              }

              @Override
              protected String[] getLibraries() {
                  return new String[]{ "SDL2", "RSDKv2" };
              }

              private int getZone(float x, float y, int w, int h) {
                  float nx = x / w;
                  float ny = y / h;
                  // ESC button (top-right corner)
                  if (nx > 0.85f && ny < 0.12f) return ZONE_ESC;
                  if (nx > 0.65f) {
                      if (ny < 0.35f) return ZONE_B;
                      if (ny < 0.65f) return ZONE_A;
                      if (ny < 0.85f) return ZONE_C;
                      return ZONE_START;
                  }
                  float cx = 0.275f;
                  float cy = 0.5f;
                  float dx = nx - cx;
                  float dy = ny - cy;
                  if (Math.abs(dx) < 0.18f && Math.abs(dy) < 0.25f) {
                      if (dy < -0.08f) return ZONE_UP;
                      if (dy > 0.08f) return ZONE_DOWN;
                      if (dx < -0.06f) return ZONE_LEFT;
                      if (dx > 0.06f) return ZONE_RIGHT;
                  }
                  return -1;
              }

              private void setZone(int zone, boolean pressed) {
                  if (zone < 0 || zone >= zonePressed.length) return;
                  if (zonePressed[zone] == pressed) return;
                  zonePressed[zone] = pressed;
                  int scancode;
                  switch (zone) {
                      case ZONE_UP: scancode = SCAN_UP; break;
                      case ZONE_DOWN: scancode = SCAN_DOWN; break;
                      case ZONE_LEFT: scancode = SCAN_LEFT; break;
                      case ZONE_RIGHT: scancode = SCAN_RIGHT; break;
                      case ZONE_A: scancode = SCAN_A; break;
                      case ZONE_B: scancode = SCAN_S; break;
                      case ZONE_C: scancode = SCAN_D; break;
                      case ZONE_START: scancode = SCAN_RETURN; break;
                      case ZONE_ESC: scancode = SCAN_ESC; break;
                      default: return;
                  }
                  if (pressed) nativeSetKeyState(scancode, 1);
                  else nativeSetKeyState(scancode, 0);
              }

              @Override
              public boolean dispatchTouchEvent(MotionEvent event) {
                  int action = event.getActionMasked();
                  int w = overlay.getWidth();
                  int h = overlay.getHeight();
                  if (w == 0 || h == 0) return super.dispatchTouchEvent(event);

                  if (action == MotionEvent.ACTION_DOWN || action == MotionEvent.ACTION_POINTER_DOWN) {
                      int idx = event.getActionIndex();
                      int zone = getZone(event.getX(idx), event.getY(idx), w, h);
                      setZone(zone, true);
                      overlay.invalidate();
                  } else if (action == MotionEvent.ACTION_UP || action == MotionEvent.ACTION_POINTER_UP) {
                      int idx = event.getActionIndex();
                      int zone = getZone(event.getX(idx), event.getY(idx), w, h);
                      setZone(zone, false);
                      overlay.invalidate();
                  } else if (action == MotionEvent.ACTION_MOVE) {
                      boolean[] touched = new boolean[8];
                      for (int i = 0; i < event.getPointerCount(); i++) {
                          int zone = getZone(event.getX(i), event.getY(i), w, h);
                          if (zone >= 0) touched[zone] = true;
                      }
                      for (int z = 0; z < 8; z++) {
                          if (zonePressed[z] && !touched[z]) setZone(z, false);
                      }
                      overlay.invalidate();
                  }
                  return super.dispatchTouchEvent(event);
              }

              // Visible gamepad overlay view
              class GamePadOverlay extends View {
                  private Paint btnPaint, btnPressedPaint, textPaint, dpadPaint, dpadArrowPaint;

                  GamePadOverlay(android.content.Context ctx) {
                      super(ctx);
                      setClickable(false);
                      setFocusable(false);

                      btnPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                      btnPaint.setColor(Color.argb(80, 255, 255, 255));
                      btnPaint.setStyle(Paint.Style.FILL);

                      btnPressedPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                      btnPressedPaint.setColor(Color.argb(160, 255, 100, 100));
                      btnPressedPaint.setStyle(Paint.Style.FILL);

                      textPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                      textPaint.setColor(Color.argb(180, 255, 255, 255));
                      textPaint.setTextSize(36);
                      textPaint.setTextAlign(Paint.Align.CENTER);

                      dpadPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                      dpadPaint.setColor(Color.argb(60, 255, 255, 255));
                      dpadPaint.setStyle(Paint.Style.FILL);

                      dpadArrowPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                      dpadArrowPaint.setColor(Color.argb(140, 255, 255, 255));
                      dpadArrowPaint.setTextSize(48);
                      dpadArrowPaint.setTextAlign(Paint.Align.CENTER);
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      int w = getWidth();
                      int h = getHeight();
                      if (w == 0 || h == 0) return;

                      // D-pad center and size
                      float dpadCx = w * 0.275f;
                      float dpadCy = h * 0.5f;
                      float dpadSize = Math.min(w, h) * 0.22f;

                      // Draw D-pad background circle
                      canvas.drawCircle(dpadCx, dpadCy, dpadSize, dpadPaint);

                      // Draw D-pad arrows
                      float arrowDist = dpadSize * 0.6f;
                      canvas.drawText("\u25B2", dpadCx, dpadCy - arrowDist + 15, dpadArrowPaint);
                      canvas.drawText("\u25BC", dpadCx, dpadCy + arrowDist + 15, dpadArrowPaint);
                      canvas.drawText("\u25C0", dpadCx - arrowDist, dpadCy + 15, dpadArrowPaint);
                      canvas.drawText("\u25B6", dpadCx + arrowDist, dpadCy + 15, dpadArrowPaint);

                      // Highlight pressed D-pad direction
                      if (zonePressed[ZONE_UP]) canvas.drawCircle(dpadCx, dpadCy - arrowDist, dpadSize * 0.3f, btnPressedPaint);
                      if (zonePressed[ZONE_DOWN]) canvas.drawCircle(dpadCx, dpadCy + arrowDist, dpadSize * 0.3f, btnPressedPaint);
                      if (zonePressed[ZONE_LEFT]) canvas.drawCircle(dpadCx - arrowDist, dpadCy, dpadSize * 0.3f, btnPressedPaint);
                      if (zonePressed[ZONE_RIGHT]) canvas.drawCircle(dpadCx + arrowDist, dpadCy, dpadSize * 0.3f, btnPressedPaint);

                      // Action buttons (right side)
                      float btnRadius = Math.min(w, h) * 0.06f;
                      float btnX = w * 0.82f;

                      // A button (center-right)
                      float aY = h * 0.5f;
                      canvas.drawCircle(btnX, aY, btnRadius, zonePressed[ZONE_A] ? btnPressedPaint : btnPaint);
                      canvas.drawText("A", btnX, aY + 14, textPaint);

                      // B button (top-right)
                      float bY = h * 0.25f;
                      canvas.drawCircle(btnX - btnRadius * 1.5f, bY, btnRadius, zonePressed[ZONE_B] ? btnPressedPaint : btnPaint);
                      canvas.drawText("B", btnX - btnRadius * 1.5f, bY + 14, textPaint);

                      // C button (below A)
                      float cY = h * 0.72f;
                      canvas.drawCircle(btnX, cY, btnRadius, zonePressed[ZONE_C] ? btnPressedPaint : btnPaint);
                      canvas.drawText("C", btnX, cY + 14, textPaint);

                      // Start button (bottom-center-right)
                      float startX = w * 0.68f;
                      float startY = h * 0.88f;
                      float startW = btnRadius * 2.5f;
                      float startH = btnRadius * 0.8f;
                      RectF startRect = new RectF(startX - startW, startY - startH, startX + startW, startY + startH);
                      canvas.drawRoundRect(startRect, 20, 20, zonePressed[ZONE_START] ? btnPressedPaint : btnPaint);
                      canvas.drawText("START", startX, startY + 14, textPaint);

                      // ESC button (top-right corner)
                      float escX = w * 0.92f;
                      float escY = h * 0.06f;
                      float escRadius = Math.min(w, h) * 0.04f;
                      canvas.drawCircle(escX, escY, escRadius, zonePressed[ZONE_ESC] ? btnPressedPaint : btnPaint);
                      textPaint.setTextSize(20);
                      canvas.drawText("ESC", escX, escY + 7, textPaint);
                      textPaint.setTextSize(36);
                  }
              }
          }
          JAVA

          # Compile + link resources
          $BT/aapt2 compile --dir $APK/res -o /tmp/res.zip
          $BT/aapt2 link -o /tmp/unsigned.apk -I $AJAR --manifest $APK/AndroidManifest.xml -R /tmp/res.zip --auto-add-overlay

          # Add native libs
          cd $APK && zip -r /tmp/unsigned.apk lib/

          # Compile SDL2 Java + custom Activity
          mkdir -p /tmp/classes
          JAR31="$ANDROID_HOME/platforms/android-31/android.jar"
          javac -source 11 -target 11 -cp $JAR31 -d /tmp/classes \
            /tmp/sdl2-java/org/libsdl/app/*.java \
            $APK/java/com/rsdkmodding/rsdkv2/RSDKv2.java 2>&1
          mkdir -p /tmp/d8out
          $BT/d8 --output /tmp/d8out $(find /tmp/classes -name "*.class") 2>&1
          cd /tmp && zip -j unsigned.apk d8out/classes.dex

          # Align + sign
          $BT/zipalign -f 4 unsigned.apk aligned.apk
          if [ ! -f /tmp/debug.keystore ]; then
            keytool -genkeypair -v -keystore /tmp/debug.keystore -alias androiddebug -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          $BT/apksigner sign --ks /tmp/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebug --out $WORK/RSDKv2.apk aligned.apk

          echo "=== RSDKv2 APK ==="
          du -h $WORK/RSDKv2.apk
          $BT/aapt2 dump badging $WORK/RSDKv2.apk 2>&1 | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: RSDKv2-Android-arm64
          path: RSDKv2-Decompilation/RSDKv2.apk
          retention-days: 30
