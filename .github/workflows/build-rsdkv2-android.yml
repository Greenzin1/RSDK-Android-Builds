name: Build RSDKv2 Android (Sonic Nexus)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-rsdkv2-android.yml'
  workflow_dispatch:

env:
  ANDROID_NDK_VERSION: "26.1.10909125"
  ANDROID_API: 21
  ANDROID_BUILD_TOOLS: "34.0.0"
  ABI: arm64-v8a

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install NDK
        run: |
          sdkmanager "ndk;${{ env.ANDROID_NDK_VERSION }}" "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" "platforms;android-${{ env.ANDROID_API }}" "platforms;android-28"
          echo "NDK_PATH=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV

      - name: Clone RSDKv2
        run: git clone --recursive https://github.com/RSDKModding/RSDKv2-Decompilation.git

      - name: Create Android.cmake
        working-directory: RSDKv2-Decompilation
        run: |
          cat > platforms/Android.cmake << 'CMAKE'
          add_library(RetroEngine SHARED ${RETRO_FILES})

          set(SDL2_DIR "${CMAKE_SOURCE_DIR}/android-deps/SDL2")
          target_include_directories(RetroEngine PRIVATE
              ${SDL2_DIR}/include
              ${SDL2_DIR}/include/SDL2
          )

          add_library(SDL2 STATIC IMPORTED)
          set_target_properties(SDL2 PROPERTIES IMPORTED_LOCATION ${SDL2_DIR}/lib/${ANDROID_ABI}/libSDL2.a)
          target_include_directories(SDL2 INTERFACE ${SDL2_DIR}/include ${SDL2_DIR}/include/SDL2)

          # Pre-built static libs from android-deps
          set(DEPS "${CMAKE_SOURCE_DIR}/android-deps")
          add_library(ogg STATIC IMPORTED)
          set_target_properties(ogg PROPERTIES IMPORTED_LOCATION ${DEPS}/lib/${ANDROID_ABI}/libogg.a)
          target_include_directories(ogg INTERFACE ${DEPS}/include)

          add_library(vorbis STATIC IMPORTED)
          set_target_properties(vorbis PROPERTIES IMPORTED_LOCATION ${DEPS}/lib/${ANDROID_ABI}/libvorbis.a)
          target_include_directories(vorbis INTERFACE ${DEPS}/include)

          add_library(vorbisfile STATIC IMPORTED)
          set_target_properties(vorbisfile PROPERTIES IMPORTED_LOCATION ${DEPS}/lib/${ANDROID_ABI}/libvorbisfile.a)
          target_include_directories(vorbisfile INTERFACE ${DEPS}/include)

          target_link_libraries(RetroEngine SDL2 ogg vorbis vorbisfile log android EGL GLESv2 GLESv1_CM OpenSLES)
          target_include_directories(RetroEngine PRIVATE ${DEPS}/include)

          # Disable bundled source compilation
          set(COMPILE_OGG OFF CACHE BOOL "" FORCE)
          set(COMPILE_VORBIS OFF CACHE BOOL "" FORCE)

          target_compile_definitions(RetroEngine PRIVATE RETRO_PLATFORM=RETRO_ANDROID)

          set_target_properties(RetroEngine PROPERTIES
              CXX_STANDARD 17
              CXX_STANDARD_REQUIRED ON
              OUTPUT_NAME "RSDKv2"
          )
          CMAKE

      - name: Create Android helpers
        working-directory: RSDKv2-Decompilation
        run: |
          cat > RSDKv2/androidHelpers.hpp << 'H'
          #ifndef ANDROIDHELPERS_HPP
          #define ANDROIDHELPERS_HPP
          const char *getDocumentsPath();
          const char *getResourcesPath();
          #endif
          H
          cat > RSDKv2/androidHelpers.cpp << 'C'
          #include <string.h>
          #include "RetroEngine.hpp"
          static char docsPath[512] = {0};
          static char resPath[512] = {0};
          extern "C" void android_setPaths(const char* docs, const char* res) {
              if (docs) strncpy(docsPath, docs, sizeof(docsPath) - 1);
              if (res) strncpy(resPath, res, sizeof(resPath) - 1);
          }
          const char *getDocumentsPath() {
              if (!docsPath[0]) return "/sdcard/RSDK/v2/";
              return docsPath;
          }
          const char *getResourcesPath() {
              if (!resPath[0]) return "/sdcard/RSDK/v2/";
              return resPath;
          }
          C

      - name: Patch RetroEngine.hpp for Android
        working-directory: RSDKv2-Decompilation
        run: |
          python3 << 'PYEOF'
          path = 'RSDKv2/RetroEngine.hpp'
          with open(path) as f: content = f.read()
          content = content.replace(
              '#define RETRO_PLATFORM (RETRO_WIN) // Default',
              '#ifndef RETRO_PLATFORM\n#if defined(__ANDROID__)\n#define RETRO_PLATFORM (RETRO_ANDROID)\n#else\n#define RETRO_PLATFORM (RETRO_WIN)\n#endif\n#endif'
          )
          content = content.replace(
              '#elif RETRO_PLATFORM == RETRO_iOS\n#include <SDL2/SDL.h>\n#include <vorbis/vorbisfile.h>\n\n#include "cocoaHelpers.hpp"',
              '#elif RETRO_PLATFORM == RETRO_ANDROID\n#include "androidHelpers.hpp"'
          )
          content = content.replace(
              '#if RETRO_PLATFORM == RETRO_WIN || RETRO_PLATFORM == RETRO_OSX || RETRO_PLATFORM == RETRO_iOS || RETRO_PLATFORM == RETRO_UWP',
              '#if RETRO_PLATFORM == RETRO_WIN || RETRO_PLATFORM == RETRO_OSX || RETRO_PLATFORM == RETRO_iOS || RETRO_PLATFORM == RETRO_UWP || RETRO_PLATFORM == RETRO_ANDROID'
          )
          content = content.replace('#include <SDL2/SDL.h>', '#include <SDL.h>')
          with open(path, 'w') as f: f.write(content)
          print('RetroEngine.hpp patched for Android')
          PYEOF

      - name: Build SDL2 for Android
        run: |
          git clone --depth 1 --branch release-2.30.12 https://github.com/libsdl-org/SDL.git /tmp/SDL2
          cd /tmp/SDL2
          mkdir build-android && cd build-android
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ env.ABI }} \
            -DANDROID_PLATFORM=android-${{ env.ANDROID_API }} \
            -DSDL_STATIC=ON -DSDL_SHARED=OFF -DSDL_TEST=OFF -DSDL_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(nproc)
          DEP=${{ github.workspace }}/RSDKv2-Decompilation/android-deps/SDL2
          mkdir -p $DEP/lib/${{ env.ABI }}
          cp libSDL2.a $DEP/lib/${{ env.ABI }}/
          cp -r include $DEP/
          find . -name "SDL_config.h" -exec cp {} $DEP/include/SDL2/ \;
          ls $DEP/include/SDL2/SDL_config.h

      - name: Build libogg + libvorbis for Android
        run: |
          DEPS_DIR=${{ github.workspace }}/RSDKv2-Decompilation/android-deps
          TC=$NDK_PATH/build/cmake/android.toolchain.cmake
          git clone --depth 1 https://github.com/xiph/ogg.git /tmp/ogg
          cd /tmp/ogg && mkdir build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$TC -DANDROID_ABI=${{ env.ABI }} -DANDROID_PLATFORM=android-${{ env.ANDROID_API }} -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$DEPS_DIR -DCMAKE_SYSROOT=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          cmake --build . -j$(nproc) && cmake --install .
          git clone --depth 1 https://github.com/xiph/vorbis.git /tmp/vorbis
          cd /tmp/vorbis && mkdir build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$TC -DANDROID_ABI=${{ env.ABI }} -DANDROID_PLATFORM=android-${{ env.ANDROID_API }} -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$DEPS_DIR -DCMAKE_INSTALL_PREFIX=$DEPS_DIR -DOGG_INCLUDE_DIR=$DEPS_DIR/include -DOGG_LIBRARY=$DEPS_DIR/lib/${{ env.ABI }}/libogg.a -DBUILD_TESTING=OFF
          cmake --build . -j$(nproc) --target vorbis vorbisfile vorbisenc && cmake --install .
          mkdir -p $DEPS_DIR/lib/${{ env.ABI }}
          for lib in libogg.a libvorbis.a libvorbisfile.a libvorbisenc.a; do
            if [ -f $DEPS_DIR/lib/${{ env.ABI }}/$lib ]; then
              echo "$lib already in ABI dir"
            elif [ -f $DEPS_DIR/lib/$lib ]; then
              cp $DEPS_DIR/lib/$lib $DEPS_DIR/lib/${{ env.ABI }}/
              echo "Copied $lib from flat dir"
            else
              echo "WARNING: $lib not found anywhere!"
              find $DEPS_DIR -name "$lib" 2>/dev/null
            fi
          done
          ls -la $DEPS_DIR/lib/${{ env.ABI }}/

      - name: Build RSDKv2
        working-directory: RSDKv2-Decompilation
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ env.ABI }} \
            -DANDROID_PLATFORM=android-${{ env.ANDROID_API }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DRETRO_MOD_LOADER=OFF -DFORCE_CASE_INSENSITIVE=ON
          cmake --build build -j$(nproc)

      - name: Download SDL2 Java sources
        run: |
          mkdir -p /tmp/sdl2-java/org/libsdl/app
          find /tmp/SDL2 -path "*/org/libsdl/app/*.java" -exec cp {} /tmp/sdl2-java/org/libsdl/app/ \;
          ls /tmp/sdl2-java/org/libsdl/app/

      - name: Build APK
        run: |
          BT="$ANDROID_HOME/build-tools/${{ env.ANDROID_BUILD_TOOLS }}"
          AJAR="$ANDROID_HOME/platforms/android-${{ env.ANDROID_API }}/android.jar"
          WORK=${{ github.workspace }}/RSDKv2-Decompilation
          APK=/tmp/apk
          rm -rf $APK /tmp/unsigned.apk /tmp/aligned.apk $WORK/RSDKv2.apk
          mkdir -p $APK/lib/${{ env.ABI }} $APK/res/values $APK/java/com/rsdkmodding/rsdkv2

          # Find the .so
          SO=$(find $WORK/build -name "libRSDKv2.so" | head -1)
          if [ -z "$SO" ]; then echo "ERROR: libRSDKv2.so not found"; find $WORK/build -name "*.so"; exit 1; fi
          cp "$SO" $APK/lib/${{ env.ABI }}/

          # AndroidManifest.xml
          cat > $APK/AndroidManifest.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.rsdkmodding.rsdkv2"
              android:versionCode="1" android:versionName="1.0">
              <uses-feature android:glEsVersion="0x00020000" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <application android:label="Sonic Nexus" android:hasCode="true">
                  <activity android:name="com.rsdkmodding.rsdkv2.RSDKv2"
                      android:label="Sonic Nexus"
                      android:configChanges="orientation|keyboardHidden|screenSize|screenLayout|smallestScreenSize"
                      android:launchMode="singleInstance"
                      android:screenOrientation="sensorLandscape"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <meta-data android:name="android.app.lib_name" android:value="RSDKv2" />
                  </activity>
              </application>
          </manifest>
          XML

          cat > $APK/res/values/strings.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">Sonic Nexus</string></resources>
          XML

          # Custom Activity
          cat > $APK/java/com/rsdkmodding/rsdkv2/RSDKv2.java << 'JAVA'
          package com.rsdkmodding.rsdkv2;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Environment;
          import java.io.File;
          import org.libsdl.app.SDLActivity;

          public class RSDKv2 extends SDLActivity {
              private static final int PERMISSION_REQUEST = 1;

              @Override
              protected void onCreate(android.os.Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestPermissions(new String[]{
                      Manifest.permission.READ_EXTERNAL_STORAGE,
                      Manifest.permission.WRITE_EXTERNAL_STORAGE
                  }, PERMISSION_REQUEST);
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  setupDirs();
              }

              private void setupDirs() {
                  String path = Environment.getExternalStorageDirectory().getAbsolutePath() + "/RSDK/v2";
                  new File(path).mkdirs();
              }

              @Override
              protected String[] getLibraries() {
                  return new String[]{ "SDL2", "RSDKv2" };
              }
          }
          JAVA

          # Compile + link resources
          $BT/aapt2 compile --dir $APK/res -o /tmp/res.zip
          $BT/aapt2 link -o /tmp/unsigned.apk -I $AJAR --manifest $APK/AndroidManifest.xml -R /tmp/res.zip --auto-add-overlay

          # Add native libs
          cd $APK && zip -r /tmp/unsigned.apk lib/

          # Compile SDL2 Java + custom Activity
          mkdir -p /tmp/classes
          JAR28="$ANDROID_HOME/platforms/android-28/android.jar"
          javac -source 11 -target 11 -cp $JAR28 -d /tmp/classes \
            /tmp/sdl2-java/org/libsdl/app/SDL.java \
            /tmp/sdl2-java/org/libsdl/app/SDLActivity.java \
            /tmp/sdl2-java/org/libsdl/app/SDLSurface.java \
            /tmp/sdl2-java/org/libsdl/app/SDLAudioManager.java \
            /tmp/sdl2-java/org/libsdl/app/SDLControllerManager.java \
            /tmp/sdl2-java/org/libsdl/app/HIDDevice.java \
            /tmp/sdl2-java/org/libsdl/app/HIDDeviceUSB.java \
            /tmp/sdl2-java/org/libsdl/app/HIDDeviceBLESteamController.java \
            $APK/java/com/rsdkmodding/rsdkv2/RSDKv2.java 2>&1 || true
          $BT/d8 --output /tmp/d8out $(find /tmp/classes -name "*.class") 2>&1
          cd /tmp && zip -j unsigned.apk d8out/classes.dex

          # Align + sign
          $BT/zipalign -f 4 unsigned.apk aligned.apk
          if [ ! -f /tmp/debug.keystore ]; then
            keytool -genkeypair -v -keystore /tmp/debug.keystore -alias androiddebug -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          $BT/apksigner sign --ks /tmp/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebug --out $WORK/RSDKv2.apk aligned.apk

          echo "=== RSDKv2 APK ==="
          du -h $WORK/RSDKv2.apk
          $BT/aapt2 dump badging $WORK/RSDKv2.apk 2>&1 | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: RSDKv2-Android-arm64
          path: RSDKv2-Decompilation/RSDKv2.apk
          retention-days: 30
